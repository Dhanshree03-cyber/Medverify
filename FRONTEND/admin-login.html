<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - MedVerify</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="glass-card">
            <div class="logo">🛡️ MedVerify Admin</div>
            <h2>Admin Access Only</h2>
            <form id="adminLoginForm">
                <input type="email" id="adminEmail" placeholder="Admin Email" required>
                <input type="password" id="adminPassword" placeholder="Password" required>
                <button type="submit" class="btn-primary">Login as Admin</button>
            </form>
            <p class="link-text"><a href="login.html">← Back to User Login</a></p>
            <div class="demo-credentials">
                <p>Demo: admin@medverify.com / admin123</p>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>

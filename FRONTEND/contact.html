<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - MedVerify</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="glass-card">
            <h2>Contact Us</h2>
            <p>📧 support@medverify.com</p>
            <p>📞 +91 1800 123 4567</p>
            <p>📍 Mumbai, India</p>
            <hr>
            <form id="contactForm">
                <input type="text" id="contactName" placeholder="Your Name" required>
                <input type="email" id="contactEmail" placeholder="Your Email" required>
                <textarea id="contactMessage" placeholder="Your Message" rows="4" required></textarea>
                <button type="submit" class="btn-primary">Send Message</button>
            </form>
            <button onclick="location.href='dashboard.html'" class="back-btn">← Back</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>

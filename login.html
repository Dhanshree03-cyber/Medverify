<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - MedVerify</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="glass-card">
            <div class="logo">🛡️ MedVerify</div>
            <h2>Welcome Back</h2>
            <form id="loginForm">
                <input type="email" id="email" placeholder="Email Address" required>
                <input type="password" id="password" placeholder="Password" required>
                <button type="submit" class="btn-primary">Login</button>
            </form>
            <p class="link-text">Don't have an account? <a href="register.html">Register here</a></p>
            <div class="demo-credentials">
                <p>Demo: user@medverify.com / password123</p>
                <p>Admin: admin@medverify.com / admin123</p>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
